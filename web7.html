<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>

    <style>
      img{
        max-width: 250px;
      }
    </style>

    <h1 id="nombre">Nada que mostrar</h1>
    <div id="descripcion">Selecione un planeta de la lista</div>
    <img src="" alt="" id="imagen"><!-- src (source/origen), alt (alternative/descriptivo) -->
    <hr>

    <select name="planetas" id="planetas">
    <!-- option[value=$]{$*10 -->
    <option value="">Seleccione</option>
    <option value="1">Namek</option>
    <option value="2">Tierra</option>
    <option value="3">Vegeta</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">Yardrat</option>
</select>

    <script>
      //El codigo JS  solo debe ejecutarsae cuando la pagina este lista
      document.addEventListener("DOMContentLoaded", () => {
          async function obtenerDatosPlaneta(id) {

            if (id == '' || id == undefined){
              document.getElementById("nombre").innerText = "Nada que mostrar"
              document.getElementById("descripcion").innerHTML = "Selecione un planeta de la lista"
              document.getElementById("imagen").removeAttribute("src")
              document.getElementById("imagen").removeAttribute("alt")
              return;
            }

            const URL = `https://dragonball-api.com/api/planets/${id}`;

            //HTTP SERVER CODE
            //2XX     : Proceso satisfactorio
            //4XX     :Error generado por el usuario
            //5XX     :Error en el servidor
            //Petición.. (await : espera, a que se resuelva la promesa)
            const respuesta = await fetch(URL);

            //Verificar: Si la respuesta no es correcta
            if (!respuesta.ok) {
              console.log(`Error en la petición`);
              return;
            }

            //La petición se realizo correctamente
            const datos = await respuesta.json();
            console.log(datos);

            //Mostrar nombre, descripcion e imagen
            document.getElementById("descripcion").innerText = datos.description;
            document.getElementById("nombre").innerText = datos.name;
            document.getElementById("imagen").setAttribute("src", datos.image)
            document.getElementById("imagen").setAttribute("alt", `Planeta de DB ${datos.name}`)
          }

          //Cuando se elija un planeta muestra sus datos
          document.getElementById("planetas").addEventListener("change", () => {
            const idplaneta = document.getElementById("planetas").value
            obtenerDatosPlaneta(idplaneta)

          })


        });
    </script>
  </body>
</html>
